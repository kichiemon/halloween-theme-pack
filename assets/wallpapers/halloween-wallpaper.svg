<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <radialGradient id="halloweenBgGradient" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2d1b4e" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#1a0d2e"/>
      <stop offset="100%" stop-color="#150a24"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffb347" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a0d2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

