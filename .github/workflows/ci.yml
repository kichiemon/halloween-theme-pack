name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Generate & Validate (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Generate themes from source
        run: |
          python generate.py

      - name: Run validation suite (WCAG AA, Syntax, Completeness)
        run: |
          python validate.py

      - name: Check for uncommitted generated file changes
        run: |
          git diff --exit-code themes/ halloween.yaml

  npm-package:
    name: NPM Package & Installer Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check installer script
        run: |
          node -c bin/install-skill.js

      - name: Verify npm packaging dry run
        run: |
          npm pack --dry-run
