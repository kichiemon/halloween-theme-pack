name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
            binary_name: halloween-gen-macos-arm64
            source_binary: dist/halloween-gen
          - os: macos-13
            target: macos-x86_64
            binary_name: halloween-gen-macos-x86_64
            source_binary: dist/halloween-gen
          - os: ubuntu-latest
            target: linux-x86_64
            binary_name: halloween-gen-linux-x86_64
            source_binary: dist/halloween-gen
          - os: windows-latest
            target: windows-x86_64
            binary_name: halloween-gen-windows-x86_64.exe
            source_binary: dist/halloween-gen.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Validate themes before build
        run: |
          python generate.py
          python validate.py

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --onefile --name halloween-gen generate.py

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mv ${{ matrix.source_binary }} ${{ matrix.binary_name }}
          chmod +x ${{ matrix.binary_name }}

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        run: |
          Move-Item -Path ${{ matrix.source_binary }} -Destination ${{ matrix.binary_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: List release assets
        run: |
          ls -lh release-binaries/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-binaries/*
          generate_release_notes: true
