# Halloween Day theme for tmux
set -g status-style "bg=#e8dcce,fg=#241432"
set -g status-left-style "bg=#bf4904,fg=#faf4eb,bold"
set -g status-right-style "bg=#e8dcce,fg=#756388"
set -g pane-border-style "fg=#d8c8b4"
set -g pane-active-border-style "fg=#bf4904"
set -g message-style "bg=#bf4904,fg=#faf4eb"
set -g mode-style "bg=#bf4904,fg=#faf4eb"
setw -g window-status-style "fg=#756388"
setw -g window-status-current-style "fg=#bf4904,bold"
