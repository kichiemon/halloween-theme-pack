# Halloween Day theme for Helix
"ui.background" = "#faf4eb"
"ui.text" = "#241432"
"ui.text.focus" = "#bf4904"
"ui.selection" = { bg = "#e5d0b5" }
"ui.cursor" = { bg = "#bf4904", fg = "#faf4eb" }
"ui.linenr" = "#756388"
"ui.linenr.selected" = "#bf4904"
"ui.statusline" = { fg = "#241432", bg = "#e8dcce" }
"ui.popup" = { bg = "#f2e7d8", fg = "#241432" }
"ui.menu" = { bg = "#f2e7d8", fg = "#241432" }
"ui.menu.selected" = { bg = "#bf4904", fg = "#faf4eb" }
"ui.help" = { bg = "#f2e7d8", fg = "#241432" }

"comment" = { fg = "#756388", modifiers = ["italic"] }
"keyword" = { fg = "#bf4904", modifiers = ["bold"] }
"string" = "#1b772d"
"constant.numeric" = "#b81438"
"function" = "#2b4acb"
"type" = "#7e22ce"
"operator" = "#0e7490"
"variable" = "#241432"
"punctuation" = "#756388"

"diagnostic.error" = "#b81438"
"diagnostic.warning" = "#9e6000"
"diagnostic.info" = "#2b4acb"
"diagnostic.hint" = "#1b772d"

[palette]
background = "#faf4eb"
foreground = "#241432"
accent = "#bf4904"
