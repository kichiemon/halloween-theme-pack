# Halloween Vampire Velvet theme for tmux
set -g status-style "bg=#5a131f,fg=#f7ebdc"
set -g status-left-style "bg=#d4af37,fg=#4a0e17,bold"
set -g status-right-style "bg=#5a131f,fg=#bfa3a8"
set -g pane-border-style "fg=#6a1b28"
set -g pane-active-border-style "fg=#d4af37"
set -g message-style "bg=#d4af37,fg=#4a0e17"
set -g mode-style "bg=#d4af37,fg=#4a0e17"
setw -g window-status-style "fg=#bfa3a8"
setw -g window-status-current-style "fg=#d4af37,bold"
