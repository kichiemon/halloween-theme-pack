# Halloween Phantom Mint theme for tmux
set -g status-style "bg=#1c2b45,fg=#e6edf5"
set -g status-left-style "bg=#2ef8a0,fg=#0e1626,bold"
set -g status-right-style "bg=#1c2b45,fg=#8fa2b8"
set -g pane-border-style "fg=#273a5a"
set -g pane-active-border-style "fg=#2ef8a0"
set -g message-style "bg=#2ef8a0,fg=#0e1626"
set -g mode-style "bg=#2ef8a0,fg=#0e1626"
setw -g window-status-style "fg=#8fa2b8"
setw -g window-status-current-style "fg=#2ef8a0,bold"
