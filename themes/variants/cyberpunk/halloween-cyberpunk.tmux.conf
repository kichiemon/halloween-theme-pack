# Halloween Cyberpunk theme for tmux
set -g status-style "bg=#240046,fg=#fcf7ff"
set -g status-left-style "bg=#ff6d00,fg=#0d0221,bold"
set -g status-right-style "bg=#240046,fg=#9d79bc"
set -g pane-border-style "fg=#5a189a"
set -g pane-active-border-style "fg=#ff6d00"
set -g message-style "bg=#ff6d00,fg=#0d0221"
set -g mode-style "bg=#ff6d00,fg=#0d0221"
setw -g window-status-style "fg=#9d79bc"
setw -g window-status-current-style "fg=#ff6d00,bold"
