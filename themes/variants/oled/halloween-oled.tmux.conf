# Halloween OLED theme for tmux
set -g status-style "bg=#1a0a2a,fg=#f4e7d3"
set -g status-left-style "bg=#ff6b35,fg=#000000,bold"
set -g status-right-style "bg=#1a0a2a,fg=#b8a9d9"
set -g pane-border-style "fg=#2c1845"
set -g pane-active-border-style "fg=#ff6b35"
set -g message-style "bg=#ff6b35,fg=#000000"
set -g mode-style "bg=#ff6b35,fg=#000000"
setw -g window-status-style "fg=#b8a9d9"
setw -g window-status-current-style "fg=#ff6b35,bold"
