# Halloween Pastel theme for Yazi
[mgr]
cwd = { fg = "#0e7490" }
hovered = { fg = "#faf5fc", bg = "#bf4904" }
preview_hovered = { underline = true }
find_keyword = { fg = "#9e6000", bold = true }
marker_copied = { fg = "#1b772d", bg = "#f2e8f7" }
marker_cut = { fg = "#b81438", bg = "#f2e8f7" }
marker_selected = { fg = "#bf4904", bg = "#f2e8f7" }
tab_active = { fg = "#faf5fc", bg = "#bf4904" }
tab_inactive = { fg = "#756388", bg = "#f2e8f7" }
border_style = { fg = "#dcc9e8" }

[status]
separator_open = ""
separator_close = ""
progress_label = { fg = "#3c2a4d", bold = true }
progress_normal = { fg = "#2b4acb", bg = "#f2e8f7" }
progress_error = { fg = "#b81438", bg = "#f2e8f7" }

[select]
border = { fg = "#bf4904" }
active = { fg = "#9e6000" }
inactive = { fg = "#3c2a4d" }

[input]
border = { fg = "#bf4904" }
title = { fg = "#3c2a4d" }
value = { fg = "#3c2a4d" }
selected = { bg = "#e5d0f0" }

[completion]
border = { fg = "#bf4904" }
active = { fg = "#faf5fc", bg = "#bf4904" }
inactive = { fg = "#3c2a4d" }
