# Halloween Pastel theme for tmux
set -g status-style "bg=#e9daf2,fg=#3c2a4d"
set -g status-left-style "bg=#bf4904,fg=#faf5fc,bold"
set -g status-right-style "bg=#e9daf2,fg=#756388"
set -g pane-border-style "fg=#dcc9e8"
set -g pane-active-border-style "fg=#bf4904"
set -g message-style "bg=#bf4904,fg=#faf5fc"
set -g mode-style "bg=#bf4904,fg=#faf5fc"
setw -g window-status-style "fg=#756388"
setw -g window-status-current-style "fg=#bf4904,bold"
