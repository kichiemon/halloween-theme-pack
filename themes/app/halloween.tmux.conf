# Halloween theme for tmux
set -g status-style "bg=#2d1b4e,fg=#f4e7d3"
set -g status-left-style "bg=#ff6b35,fg=#1a0d2e,bold"
set -g status-right-style "bg=#2d1b4e,fg=#b8a9d9"
set -g pane-border-style "fg=#3d2a5e"
set -g pane-active-border-style "fg=#ff6b35"
set -g message-style "bg=#ff6b35,fg=#1a0d2e"
set -g mode-style "bg=#ff6b35,fg=#1a0d2e"
setw -g window-status-style "fg=#b8a9d9"
setw -g window-status-current-style "fg=#ff6b35,bold"
